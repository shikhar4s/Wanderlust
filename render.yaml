services:
  - type: web
    name: wanderlust-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && daphne -b 0.0.0.0 -p $PORT wanderlust.asgi:application
    healthCheckPath: /api/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: wanderlust-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://wanderlust-web.onrender.com
      - key: POSTGRES_DB
        fromDatabase:
          name: wanderlust-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: wanderlust-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: wanderlust-postgres
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: wanderlust-postgres
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: wanderlust-postgres
          property: port
      - key: REDIS_URL
        fromService:
          name: wanderlust-realtime
          type: keyvalue
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash

  - type: keyvalue
    name: wanderlust-realtime
    region: singapore
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: wanderlust-web
    runtime: static
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://wanderlust-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: wanderlust-postgres
    databaseName: wanderlust
    user: wanderlust
    region: singapore
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
